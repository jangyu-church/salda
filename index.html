<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살다보면</title>
<meta name="theme-color" content="#FF7A59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="살다보면">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#FFF8F1; --card:#FFFFFF; --ink:#22252B; --sub:#6B7280; --line:#F0E6DA;
  --pri:#FF7A59; --pri2:#FF4F8B; --soft:#FFF0E6;
  --c0:#4F7CFF; --c1:#FF9F1C; --c2:#12B5A6; --c3:#9B5DE5; --c4:#F15BB5;
}
html[data-theme="dark"]{--bg:#13151A;--card:#1E222B;--ink:#F3F4F6;--sub:#A3A9B5;--line:#2C323E;--soft:#2A2420}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{--bg:#13151A;--card:#1E222B;--ink:#F3F4F6;--sub:#A3A9B5;--line:#2C323E;--soft:#2A2420}
}
*{box-sizing:border-box}
html{font-size:17px}
html[data-size="big"]{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 100px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
.brand{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
h2{font-size:1.15rem;margin:0 0 10px}
.sub{color:var(--sub);font-size:.9rem}
.demo{background:#FDE68A;color:#713F12;border-radius:12px;padding:8px 12px;font-size:.85rem;margin-top:8px}
.notice{display:flex;gap:8px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem;margin-top:8px;width:100%;text-align:left}
.notice span.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice.open span.t{white-space:normal}
.install{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}
.install h2{color:#fff}
.install .row2{display:flex;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 18px;border-radius:14px;font-weight:700;
  background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.btn.white{background:#fff;color:#E2512F;flex:1}
.btn.ghost{background:rgba(255,255,255,.22);color:#fff}
.btn.line{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.btn.it{background:var(--ic)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.datenav b{font-size:1.15rem}
.datenav button{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.3rem}
.datenav button:disabled{opacity:.3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:1.5rem;line-height:1.2}
.stat span{font-size:.8rem;color:var(--sub)}
/* 미션 카드 */
.mc{border:2px solid var(--line);border-left:6px solid var(--ic)}
.mc.done{border-color:var(--ic);background:color-mix(in srgb,var(--ic) 7%,var(--card))}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mh .em{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--ic) 14%,var(--card));flex:none}
.mh b{font-size:1.2rem;flex:1}
.badge{font-size:.85rem;font-weight:800;color:#fff;background:var(--ic);border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge.off{background:var(--soft);color:var(--sub)}
.lbl{font-size:.82rem;font-weight:700;color:var(--ic);margin-bottom:2px}
.passage{font-size:1.3rem;font-weight:800;line-height:1.35}
.mbox{background:var(--soft);border-radius:14px;padding:12px 14px;margin:8px 0 10px}
.mbox .mt{font-size:1.08rem;font-weight:700}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:2px;color:#fff;background:var(--ic)}
.tag.own{background:#64748B}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{flex:1;min-height:42px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.9rem;font-weight:700}
.tools button:disabled{opacity:.4}
.quote{border-left:4px solid var(--ic);padding:6px 0 6px 12px;margin:8px 0;font-size:1.02rem}
.undo{font-size:.85rem;color:var(--sub);text-decoration:underline;padding:8px 4px;min-height:40px}
.donebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.donebar b{color:var(--ic);font-size:1.05rem}
.prog{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.prog .tr{flex:1;height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--ic);border-radius:7px}
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:60px;border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin:8px 0;background:var(--card)}
.svc .ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800;flex:none}
.svc b{flex:1;font-size:1.08rem}
.svc.on{border-color:var(--ic);background:color-mix(in srgb,var(--ic) 10%,var(--card))}
.svc.on .ck{background:var(--ic);border-color:var(--ic);color:#fff}
.elist{margin-top:10px}
.elist div{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:.95rem}
.elist div span{flex:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{font-size:.8rem;color:var(--sub)}
.week .n{width:38px;height:38px;border-radius:50%;margin:4px auto 0;display:grid;place-items:center;font-weight:700;background:var(--soft);color:var(--sub)}
.week .n.has{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.week .today .d{color:var(--pri);font-weight:800}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pt{font-weight:800;font-size:1.05rem;white-space:nowrap}
.pt small{font-weight:500;color:var(--sub)}
.clap{min-width:48px;min-height:44px;border-radius:12px;background:var(--soft);font-size:1.2rem}
.clap:disabled{opacity:.4}
.me-tag{font-size:.7rem;background:var(--pri);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card{margin:0;padding:14px 12px}
.rank{display:flex;align-items:center;gap:6px;padding:6px 0;font-size:.95rem}
.rank .no{width:26px;text-align:center;flex:none}
.rank .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm small{color:var(--sub)}
.rank.mine{font-weight:800;color:var(--pri)}
.more{display:block;width:100%;padding:10px 0 2px;color:var(--pri);font-weight:700;font-size:.9rem}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.bar{margin:12px 0}
.bar .hd{display:flex;justify-content:space-between;font-size:.95rem}
.bar .tr{height:14px;border-radius:7px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar .tr i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.sum5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.sum5 div{background:var(--soft);border-radius:12px;padding:8px 2px}
.sum5 b{display:block;font-size:1.2rem}
.sum5 span{font-size:.75rem;color:var(--sub)}
.feed{padding:12px 0;border-top:1px solid var(--line)}
.feed:first-of-type{border-top:0}
.feed .who{font-size:.85rem;color:var(--sub)}
.feed .ms{font-size:.85rem;color:var(--sub);margin-top:2px}
.feed .nt{font-size:1.02rem;margin-top:4px}
textarea,input[type=text],input[type=tel],select{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:12px 14px}
textarea{min-height:80px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--pri)}
label{display:block;font-weight:700;margin:14px 0 6px}
.mc label{margin:10px 0 6px;font-size:.92rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
nav.tabs div{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;padding:8px 0 10px;font-size:.8rem;color:var(--sub);font-weight:600}
nav.tabs button span{display:block;font-size:1.5rem;line-height:1.3}
nav.tabs button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:end center;z-index:20}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px 26px;max-height:88vh;overflow:auto}
.opt{display:flex;gap:8px}
.opt button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--line);font-weight:700}
.opt button.on{border-color:var(--pri);color:var(--pri)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#22252B;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:30;max-width:90%;text-align:center}
.hero{text-align:center;padding:36px 0 8px}
.hero .logo{font-size:3.2rem}
.hero h1{margin:6px 0 4px;font-size:2rem}
ol.guide{padding-left:1.2em;margin:8px 0}
ol.guide li{margin:6px 0}
.empty{text-align:center;color:var(--sub);padding:18px 0}
/* 관리 화면 */
.aseg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.aseg button{flex:1 1 30%;min-height:44px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.92rem}
.aseg button.on{border-color:var(--pri);color:var(--pri);background:var(--soft)}
.alist div.ai{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.alist div.ai:first-child{border-top:0}
.alist .tx{flex:1;min-width:0}
.alist .tx small{display:block;color:var(--sub);font-size:.82rem}
.del{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.85rem;font-weight:700;color:#DC2626;white-space:nowrap}
.del.sure{background:#DC2626;color:#fff;border-color:#DC2626}
.del:disabled{color:var(--sub)}
.dtag{display:inline-block;font-size:.75rem;font-weight:800;color:#fff;background:var(--pri);border-radius:6px;padding:1px 7px;margin-right:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);font-weight:800;background:var(--card)}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.prev7 div{display:flex;gap:10px;padding:5px 0;font-size:.95rem}
.prev7 div span:first-child{width:84px;color:var(--sub);flex:none}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<nav class="tabs" id="tabs" hidden><div>

  <button data-tab="cheer"><span>💌</span>응원</button>

</div></nav>
<div id="modal"></div>
<script src="config.js"></script>
<script>
(function(){

/* 시트에 미션이 없을 때 쓰는 기본 미션 */
var DEF={
 qt:['오늘 본문에서 마음에 가장 남은 한 구절과 그 까닭을 적어 보세요','오늘 본문에서 하나님은 어떤 분으로 나타나시나요? 한 줄로 적어 보세요','오늘 말씀대로 살기 위해 내려놓을 것 한 가지를 적어 보세요','오늘 본문 속 인물 가운데 나와 닮은 사람은 누구인가요?','오늘 말씀 속에서 나에게 주신 약속 하나를 찾아 적어 보세요','오늘 말씀으로 드리는 한 줄 기도를 적어 보세요','오늘 본문에서 감사할 것 한 가지를 찾아 적어 보세요','오늘 말씀을 오늘 하루 어디에서 지킬지 구체적으로 적어 보세요','오늘 본문 앞에서 회개할 것 하나를 적어 보세요','오늘 말씀을 한 사람에게 전한다면 무엇이라고 말할지 적어 보세요'],
 evangel:['태신자에게 안부 문자를 보내고, 당신을 위해 기도하고 있다고 알려 주세요','아직 교회에 다니지 않는 분과 차 한 잔 나누며 내가 만난 예수님 이야기를 들려주세요','믿지 않는 가족에게 "당신을 위해 기도해요"라고 말해 보세요','이웃이나 직장 동료를 주일예배에 초대해 보세요','교회 소개 카드나 전도지를 한 분께 직접 건네 보세요','요한복음 3장 16절을 한 분께 읽어 드리고 뜻을 나눠 보세요','내가 받은 기도 응답 하나를 믿지 않는 친구에게 들려주세요','주일설교 영상 링크를 한 분께 보내며 따뜻한 인사를 덧붙여 보세요','아픈 이웃을 찾아가 위로하고, 함께 기도해도 되는지 여쭤 보세요','식사 자리에서 감사 기도를 드리고 왜 기도하는지 이야기해 보세요'],
 share:['오늘 한 사람을 정해 도와주세요 — 짐을 들어 드리거나 일을 거들어 보세요','오랫동안 연락 못 한 교우께 안부 전화를 드려 보세요','혼자 지내시는 어르신께 따뜻한 인사나 간식을 전해 보세요','가족에게 고맙다는 말과 함께 작은 섬김 하나를 해 보세요','오늘 만나는 사람에게 진심 어린 칭찬 한마디를 건네 보세요','어려운 이웃을 위해 작은 금액이라도 구제에 써 보세요','아픈 분의 이름을 부르며 5분 동안 기도해 주세요','내가 가진 물건 하나를 필요한 분께 나눠 보세요','누군가에게 식사 한 끼나 커피 한 잔을 대접해 보세요','교회나 동네에서 아무도 모르게 한 곳을 청소·정리해 보세요','서운했던 사람에게 먼저 다가가 따뜻한 말을 건네 보세요','경비원·환경미화원처럼 수고하는 분께 감사 인사를 전해 보세요']
};
var BOOKS=[['창세기',50],['출애굽기',40],['레위기',27],['민수기',36],['신명기',34],['여호수아',24],['사사기',21],['룻기',4],['사무엘상',31],['사무엘하',24],['열왕기상',22],['열왕기하',25],['역대상',29],['역대하',36],['에스라',10],['느헤미야',13],['에스더',10],['욥기',42],['시편',150],['잠언',31],['전도서',12],['아가',8],['이사야',66],['예레미야',52],['예레미야애가',5],['에스겔',48],['다니엘',12],['호세아',14],['요엘',3],['아모스',9],['오바댜',1],['요나',4],['미가',7],['나훔',3],['하박국',3],['스바냐',3],['학개',2],['스가랴',14],['말라기',4],['마태복음',28],['마가복음',16],['누가복음',24],['요한복음',21],['사도행전',28],['로마서',16],['고린도전서',16],['고린도후서',13],['갈라디아서',6],['에베소서',6],['빌립보서',4],['골로새서',4],['데살로니가전서',5],['데살로니가후서',3],['디모데전서',6],['디모데후서',4],['디도서',3],['빌레몬서',1],['히브리서',13],['야고보서',5],['베드로전서',5],['베드로후서',3],['요한일서',5],['요한이서',1],['요한삼서',1],['유다서',1],['요한계시록',22]];
var TOTAL=BOOKS.reduce(function(a,b){return a+b[1]},0);

/* ---------- 도구 ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function nice(s){var d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'}
function md(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h)}
function rid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- 미션 고르기 ---------- */
function reading(d){return (S.data.readings||[]).find(function(r){return r[0]===d})}
function planFor(d){
  var r=reading(d);if(r&&r[1])return r[1];
  return planCalc(S.data.plan||{},d);
}
function planCalc(p,d){
  if(!p.start||d<p.start)return '';
  var per=Math.max(1,Math.min(20,+p.per||3));
  var bi=Math.max(0,BOOKS.findIndex(function(b){return b[0]===String(p.book||'').trim()}));
  var off=0;for(var i=0;i<bi;i++)off+=BOOKS[i][1];
  var g=(off+diff(p.start,d)*per)%TOTAL,parts=[],cur=null;
  for(var k=0;k<per;k++){
    var x=(g+k)%TOTAL,b=0;while(x>=BOOKS[b][1]){x-=BOOKS[b][1];b++}
    if(cur&&cur.b===b&&cur.to===x)cur.to=x+1;else{cur={b:b,from:x+1,to:x+1};parts.push(cur)}
  }
  return parts.map(function(c){return BOOKS[c.b][0]+' '+(c.from===c.to?c.from:c.from+'–'+c.to)+(BOOKS[c.b][1]===1?'':'장')}).join(', ');
}
function servicesFor(d){
  var dt=parse(d),dw=DOW[dt.getDay()];
  return (S.data.services||[]).filter(function(s){
    var r=String(s[1]||'').replace(/\s/g,'');
    if(/^\d{4}-\d{2}-\d{2}$/.test(r))return r===d;
    if(r.charAt(0)==='첫')return r.indexOf(dw)>0&&dt.getDate()<=7;
    return r.indexOf(dw)>=0;
  }).map(function(s){return s[0]});
}
function missionFor(cat,d){
  var key=(cat==='evangel'?weekOf(d):d)+'|'+cat;
  if(S.custom[key])return {t:S.custom[key],own:true,key:key};
  var rows=(S.data.missions||[]).filter(function(m){return CAT[m[0]]===cat});
  var fixed=rows.find(function(m){return m[2]&&(cat==='evangel'?weekOf(m[2])===weekOf(d):m[2]===d)});
  if(fixed)return {t:fixed[1],fixed:true,key:key};
  var pool=rows.filter(function(m){return !m[2]}).map(function(m){return m[1]});
  if(!pool.length)pool=DEF[cat];
  var i=(hash(S.me.id+key)+(S.reroll[key]||0))%pool.length;
  return {t:pool[i],key:key,many:pool.length>1};
}

function buildDemo(){
  var t=today(),groups=['믿음 목장','소망 목장','사랑 목장','은혜 목장'];
  var names=['김하늘','이바다','박나무','최샘물','정들꽃','강한별','조이슬','윤새벽','장다솜','임보람','한가람','오누리','서단비','신아름','권슬기'];
  var members=names.map(function(n,i){return ['d'+i,n,groups[i%4]]});
  if(S.me)members.push(['me',S.me.name,groups.indexOf(S.me.group)<0?groups[0]:S.me.group]);
  var services=[['새벽기도회','월화수목금토'],['주일예배','일'],['주일오후찬양예배','일'],['수요예배','수'],['금요심야기도회','금'],['업드림기도회','첫토']];
  demo={groups:groups,members:members,recs:[],cheers:[],notice:'체험판입니다. 마음껏 눌러 보세요. 여기서 누른 것은 저장되지 않습니다.',
    missions:[['나눔','오늘은 교회 어르신 한 분께 안부 전화 드리기',t]],readings:[[t,'','요한복음 6:1–15']],services:services,plan:{start:addDays(t,-20),per:3,book:'마태복음'}};
  var QN=['내 손의 작은 것도 주님께 드리면 넉넉해진다는 것을 배웠습니다','오늘 하루 불평 대신 감사를 먼저 말하겠습니다','나를 먼저 찾아오시는 하나님이 고맙습니다','두려워 말라는 말씀을 붙들고 출근합니다'];
  var SN=['옆집 할머니 장바구니를 들어 드렸어요','오랜만에 권사님께 전화드렸더니 반가워하셨어요','동료에게 커피 한 잔 대접했습니다'];
  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  [['큐티','qt'],['전도','evangel'],['나눔','share']].forEach(function(c){DEF[c[1]].forEach(function(x){demo.missions.push([c[0],x,''])})});
  demo.groupList=groups.slice();demo.admins=[];
  var save=S.data;S.data=demo;
  members.forEach(function(m){
    if(m[0]==='me')return;
    var dil=0.25+rnd()*0.6;
    for(var k=0;k<40;k++){
      var d=addDays(t,-k);
      function add(it,dt,nt){demo.recs.push([rid()+k,d,m[0],it,dt,k<7?nt||'':''])}
      if(k===0&&rnd()<0.4)continue;
      if(rnd()<dil)add('bible',planFor(d));
      if(rnd()<dil*0.85)add('qt',DEF.qt[k%10],QN[Math.floor(rnd()*QN.length)]);
      if(rnd()<dil*0.5)add('share',DEF.share[k%12],rnd()<0.6?SN[Math.floor(rnd()*SN.length)]:'');
      if(rnd()<dil*0.12)add('evangel',['직장 동료','이웃','가족','친구'][Math.floor(rnd()*4)],'');
      servicesFor(d).forEach(function(s){if(rnd()<(s.indexOf('주일')===0?0.9:dil*0.5))add('worship',s)});
    }
  });
  S.data=save;
  var now=new Date().toISOString();
  demo.cheers=[[now,'d3','','오늘도 말씀으로 시작해요. 모두 힘내세요!'],[now,'d7','d1','👏'],[now,'d5','','새벽예배 다녀왔습니다. 은혜가 큽니다.']];
}
function demoApi(action,b){
  if(!demo)buildDemo();
  return new Promise(function(res,rej){setTimeout(function(){
    if(action==='init')return res({ok:true,groups:demo.groups});
    if(action==='join'){
      var m=demo.members.find(function(x){return x[0]==='me'});
      if(!m)demo.members.push(['me',b.name,b.group]);else{m[1]=b.name;m[2]=b.group}
      return res({ok:true,member:{id:'me',name:b.name,group:b.group}});
    }
    if(action==='state')return res(Object.assign({ok:true,isAdmin:demo.admins.indexOf(b.id)>=0,hasAdmin:demo.admins.length>0},JSON.parse(JSON.stringify(demo))));
    if(action==='admin'){try{return res(demoAdmin(b))}catch(e){return rej(e)}}
    if(action==='add'){demo.recs.push([b.rid,b.date,b.id,b.item,b.detail,b.note]);return res({ok:true})}
    if(action==='remove'){demo.recs=demo.recs.filter(function(r){return r[0]!==b.rid});return res({ok:true})}
    if(action==='cheer'){demo.cheers.push([new Date().toISOString(),b.id,b.to||'',b.text]);return res({ok:true})}
    rej(new Error('알 수 없는 요청'));
  },120)});
}

/* 체험판용 관리 (서버의 관리 기능을 흉내 냅니다) */
function demoAdmin(b){
  function no(m){var e=new Error(m);e.code='input';throw e}
  var op=b.op;
  if(op==='claim'){if(demo.admins.length)no('이미 운영진이 있습니다');demo.admins.push(b.id)}
  else if(demo.admins.indexOf(b.id)<0)no('운영진만 쓸 수 있습니다');
  function del(list,row,col,key){var i=row-2;if(!list[i]||String(list[i][col])!==String(key))no('그사이 내용이 바뀌었습니다');list.splice(i,1)}
  if(op==='notice')demo.notice=b.text;
  if(op==='plan')demo.plan={start:b.start,per:b.per,book:b.book};
  if(op==='mission_add')demo.missions.push([b.cat,b.text,b.date||'']);
  if(op==='mission_del')del(demo.missions,b.row,1,b.key);
  if(op==='reading_set'){var r=demo.readings.find(function(x){return x[0]===b.date});if(r){r[1]=b.bible;r[2]=b.qt}else demo.readings.push([b.date,b.bible,b.qt])}
  if(op==='reading_del')del(demo.readings,b.row,0,b.key);
  if(op==='service_add')demo.services.push([b.name,b.rule]);
  if(op==='service_del')del(demo.services,b.row,0,b.key);
  if(op==='group_add'){demo.groupList.push(b.name);demo.groups=demo.groupList.slice()}
  if(op==='group_del'){if(demo.members.some(function(m){return m[2]===b.key}))no('이 목장에 등록한 식구가 있어 지울 수 없습니다');del(demo.groupList.map(function(g){return [g]}),b.row,0,b.key);demo.groupList.splice(b.row-2,1);demo.groups=demo.groupList.slice()}
  if(op==='admin_add'&&demo.admins.indexOf(b.member)<0)demo.admins.push(b.member);
  if(op==='admin_del'){if(demo.admins.length<2)no('운영진이 한 명은 있어야 합니다');demo.admins=demo.admins.filter(function(x){return x!==b.member})}
  var cnt={};demo.members.forEach(function(m){cnt[m[2]]=(cnt[m[2]]||0)+1});
  function rows(l){return l.map(function(x,i){return [i+2].concat(x)})}
  return {ok:true,notice:demo.notice,plan:demo.plan,missions:rows(demo.missions),readings:rows(demo.readings),services:rows(demo.services),
    groups:rows(demo.groupList.map(function(g){return [g]})).map(function(r){return r.concat([cnt[r[1]]||0])}),admins:demo.admins.slice(),members:demo.members.slice()};
}

function adminOp(op,body,keys){
  if(S.admBusy)return;S.admBusy=true;
  api('admin',Object.assign(auth(),{op:op},body||{})).then(function(j){
    S.admin=j;S.confirm=null;(keys||[]).forEach(clearDraft);
    if(op==='claim'){S.data.isAdmin=true;S.data.hasAdmin=true;S.tab='admin';closeModal();toast('운영진이 되셨습니다. 관리 화면이 열렸습니다')}
    else if(op!=='load')toast('저장했습니다');
    S.admBusy=false;render();if(op!=='load')sync(true);
  }).catch(function(e){S.admBusy=false;S.confirm=null;toast(e.code?e.message:'저장이 안 됐습니다. 다시 해 주세요');render()});
}
function adminClick(a,el){
  if(a==='adm-sec'){S.admSec=el.dataset.s;S.confirm=null;return render()}
  if(a==='adm-cat'){S.admCat=el.dataset.c;S.confirm=null;return render()}
  if(a==='adm-mdated'){S.mDated=el.dataset.v==='1';return render()}
  if(a==='adm-smode'){S.svcMode=el.dataset.v;return render()}
  if(a==='adm-sday'){S.svcDays[el.dataset.v]=!S.svcDays[el.dataset.v];return render()}
  if(a==='adm-del'){
    var id=el.dataset.op+'|'+el.dataset.row;
    if(S.confirm!==id){S.confirm=id;return render()}
    var body=el.dataset.op.indexOf('admin_')===0?{member:el.dataset.key}:{row:+el.dataset.row,key:el.dataset.key};
    return adminOp(el.dataset.op,body);
  }
  if(a==='adm-madd'){
    var tx=draft('adm-mtext');if(tx.length<2)return toast('미션을 적어 주세요');
    var dt=S.mDated?draft('adm-mdate'):'';if(S.mDated&&!dt)return toast('날짜를 골라 주세요');
    return adminOp('mission_add',{cat:S.admCat,text:tx,date:dt},['adm-mtext']);
  }
  if(a==='adm-plan')return adminOp('plan',{start:draft('adm-pstart'),book:draft('adm-pbook'),per:+draft('adm-pper')},['adm-pstart','adm-pbook','adm-pper']);
  if(a==='adm-read'){
    var d=draft('adm-rdate'),b=draft('adm-rbible'),q=draft('adm-rqt');
    if(!d)return toast('날짜를 골라 주세요');if(!b&&!q)return toast('성경 분량이나 큐티 본문을 적어 주세요');
    return adminOp('reading_set',{date:d,bible:b,qt:q},['adm-rbible','adm-rqt']);
  }
  if(a==='adm-sadd'){
    var n=draft('adm-sname'),rule;if(n.length<2)return toast('예배 이름을 적어 주세요');
    if(S.svcMode==='day'){rule=draft('adm-sdate');if(!rule)return toast('날짜를 골라 주세요')}
    else{rule=DOW.split('').filter(function(c){return S.svcDays[c]}).join('');if(!rule)return toast('요일을 골라 주세요');if(S.svcMode==='first')rule='첫'+rule}
    S.svcDays={};return adminOp('service_add',{name:n,rule:rule},['adm-sname']);
  }
  if(a==='adm-notice')return adminOp('notice',{text:draft('adm-notice')},['adm-notice']);
  if(a==='adm-gadd'){var g=draft('adm-gname');if(g.length<2)return toast('목장 이름을 적어 주세요');return adminOp('group_add',{name:g},['adm-gname'])}
  if(a==='adm-staff'){var m=draft('adm-staff');if(!m)return;return adminOp('admin_add',{member:m},['adm-staff'])}
}

function render(){
  applyPrefs();
  Array.prototype.forEach.call(document.querySelectorAll('[data-keep]'),function(el){S.drafts[el.dataset.keep]=el.value});
  var app=$('#app'),tabs=$('#tabs');
  if(!S.me){tabs.hidden=true;app.innerHTML=viewJoin();return}
  tabs.hidden=false;
  $('#tab-admin').hidden=!(S.data&&S.data.isAdmin);
  Array.prototype.forEach.call(tabs.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.tab===S.tab)});
  var head='<header class="top"><div class="brand">살다보면</div><div>'+
    '<button class="icon-btn" data-act="refresh" aria-label="새로 고침">🔄</button> '+
    '<button class="icon-btn" data-act="settings" aria-label="설정">⚙️</button></div></header>';
  if(DEMO)head+='<div class="demo">체험판 화면입니다 — 보기용 가짜 자료이며 저장되지 않습니다.</div>';
  if(!S.data){app.innerHTML=head+'<div class="empty">불러오는 중입니다…</div>';return}
  app.innerHTML=head+{today:viewToday,group:viewGroup,church:viewChurch,cheer:viewCheer,admin:viewAdmin}[S.tab]();
  Array.prototype.forEach.call(document.querySelectorAll('[data-keep]'),function(el){var v=S.drafts[el.dataset.keep];if(v!=null)el.value=v});
}

function ranking(from,to){
  var list=S.data.members.map(function(m){return {id:m[0],name:m[1],group:m[2],p:pts(m[0],from,to)}}).filter(function(x){return x.p>0});
  list.sort(function(a,b){return b.p-a.p||a.name.localeCompare(b.name,'ko')});
  var prev=null,rank=0;list.forEach(function(x,i){if(x.p!==prev){rank=i+1;prev=x.p}x.rank=rank});
  return list;
}
function rankCard(title,list,more,key){
  var medal=['🥇','🥈','🥉'],show=more?list:list.filter(function(x){return x.rank<=3}).slice(0,5);
  var h='<div class="card"><h2>'+title+'</h2>';
  if(!list.length)h+='<div class="empty">아직 기록이 없습니다</div>';
  show.forEach(function(x){h+='<div class="rank'+(x.id===S.me.id?' mine':'')+'"><span class="no">'+(medal[x.rank-1]||x.rank)+'</span><span class="nm">'+esc(x.name)+(more?' <small>'+esc(x.group)+'</small>':'')+'</span><b>'+x.p+'</b></div>'});
  var mine=list.find(function(x){return x.id===S.me.id});
  if(!more&&mine&&mine.rank>3)h+='<div class="rank mine"><span class="no">'+mine.rank+'</span><span class="nm">'+esc(mine.name)+'</span><b>'+mine.p+'</b></div>';
  if(list.length>show.length||more)h+='<button class="more" data-act="more" data-k="'+key+'">'+(more?'접기':'더 보기')+'</button>';
  return h+'</div>';
}

  });
  if(!gs.length)h+='<div class="empty">아직 등록한 분이 없습니다</div>';
  return h+'<div class="sub">식구 수가 달라도 공평하도록 한 사람 평균으로 견줍니다.</div></div>';

function draft(k){var el=document.querySelector('[data-keep="'+k+'"]');return (el?el.value:(S.drafts[k]||'')).trim()}
/* 적어 둔 글을 비우기 — 다음 화면에서는 처음 값(빈칸이나 저장된 값)으로 다시 그려집니다 */
function clearDraft(k){delete S.drafts[k];var el=document.querySelector('[data-keep="'+k+'"]');if(el){el.value='';el.removeAttribute('data-keep')}}
function pushRec(r){S.data.recs.push(r);store.set('sal_cache2',S.data);index()}
function dropRec(id){S.data.recs=S.data.recs.filter(function(r){return r[0]!==id});store.set('sal_cache2',S.data);index()}
function doAdd(it,detail,note,keys){
  var d=S.date,r=[rid(),d,S.me.id,it,detail,note||''],saved={};
  (keys||[]).forEach(function(k){saved[k]=draft(k);clearDraft(k)});
  pushRec(r);render();
  var mine=recs(S.me.id,d);
  if(['bible','qt','share'].every(function(k){return mine.some(function(x){return x.it===k})})&&['bible','qt','share'].indexOf(it)>=0)toast('🎉 오늘 말씀·묵상·사랑 미션을 모두 해내셨습니다!');
  else toast(IT[it].e+' 1점이 더해졌습니다');
  api('add',Object.assign(auth(),{rid:r[0],date:d,item:it,detail:detail,note:note||''})).then(function(j){if(j.dup)sync(true)}).catch(function(e){
    dropRec(r[0]);Object.assign(S.drafts,saved);render();
    toast(e.code?e.message:'저장이 안 됐습니다. 다시 눌러 주세요');
  });
}
function doRemove(id){
  var r=S.data.recs.find(function(x){return x[0]===id});if(!r)return;
  dropRec(id);render();
  api('remove',Object.assign(auth(),{rid:id})).catch(function(e){pushRec(r);render();toast(e.code?e.message:'취소가 안 됐습니다. 다시 해 주세요')});
}
function addItem(it){
  var d=S.date;
  if(it==='bible')return doAdd('bible',planFor(d)||'자유 읽기','');
  if(it==='qt'){
    var n=draft('note-qt-'+d);
    if(n.length<2){toast('한 줄 묵상을 적어야 인증됩니다');var el=document.querySelector('[data-keep="note-qt-'+d+'"]');if(el)el.focus();return}
    return doAdd('qt',missionFor('qt',d).t,n,['note-qt-'+d]);
  }
  if(it==='share')return doAdd('share',missionFor('share',d).t,draft('note-sh-'+d),['note-sh-'+d]);
  if(it==='evangel'){
    if(recs(S.me.id,d,'evangel').length>=EV_DAY_MAX)return toast('하루에 세 번까지 적을 수 있습니다');
    var who=draft('who-'+d);
    if(!who){toast('누구에게 전했는지 적어 주세요 (예: 직장 동료)');var w=document.querySelector('[data-keep="who-'+d+'"]');if(w)w.focus();return}
    return doAdd('evangel',who,draft('note-ev-'+d),['who-'+d,'note-ev-'+d]);
  }
}
function doCheer(to,text){
  var c=[new Date().toISOString(),S.me.id,to,text];
  S.data.cheers.push(c);render();
  return api('cheer',Object.assign(auth(),{to:to,text:text})).catch(function(e){
    S.data.cheers.splice(S.data.cheers.indexOf(c),1);render();toast(e.code?e.message:'보내지 못했습니다. 다시 해 주세요');throw e;
  });
}
function doJoin(){
  var name=$('#j-name').value.trim(),group=$('#j-group').value,pin=$('#j-pin').value.trim();
  if(!name)return toast('이름을 적어 주세요');
  if(!group)return toast('목장을 골라 주세요');
  if(!/^\d{4}$/.test(pin))return toast('전화번호 뒤 네 자리 숫자를 적어 주세요');
  var btn=document.querySelector('[data-act="join"]');btn.disabled=true;
  api('join',{name:name,group:group,pin:pin}).then(function(j){
    S.me={id:j.member.id,name:j.member.name,group:j.member.group,pin:pin};store.set('sal_me',S.me);
    S.date=today();render();return sync();
  }).catch(function(e){btn.disabled=false;toast(e.code?e.message:'연결이 안 됩니다. 잠시 후 다시 해 주세요')});
}
document.addEventListener('click',function(ev){
  var tb=ev.target.closest('[data-tab]');
  if(tb){S.tab=tb.dataset.tab;S.moreW=S.moreM=false;render();window.scrollTo(0,0);return}
  var el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  var a=el.dataset.act,cat=el.dataset.cat;
  if(a.indexOf('adm-')===0)return adminClick(a,el);
  if(a==='claim')return adminOp('claim');
  if(a==='go-admin'){closeModal();S.tab='admin';render();window.scrollTo(0,0);return}
  if(a==='modal-bg'){if(ev.target===el)closeModal();return}
  if(a==='close')return closeModal();
  if(a==='join')return doJoin();
  if(a==='add')return addItem(el.dataset.it);
  if(a==='remove')return doRemove(el.dataset.rid);
  if(a==='worship'){
    var nm=el.dataset.name,r=recs(S.me.id,S.date,'worship').find(function(x){return x.dt===nm});
    return r?doRemove(r.rid):doAdd('worship',nm,'');
  }
  if(a==='reroll'){var k=missionFor(cat,S.date).key;S.reroll[k]=(S.reroll[k]||0)+1;store.set('sal_reroll',S.reroll);return render()}
  if(a==='own'){S.edit[cat]=!S.edit[cat];render();var i=document.querySelector('[data-keep="own-'+cat+'"]');if(i)i.focus();return}
  if(a==='own-save'){
    var v=draft('own-'+cat);if(v.length<2)return toast('미션을 적어 주세요');
    S.custom[missionFor(cat,S.date).key]=v;store.set('sal_custom',S.custom);S.edit[cat]=false;clearDraft('own-'+cat);toast('내 미션으로 정했습니다');return render();
  }
  if(a==='own-clear'){delete S.custom[missionFor(cat,S.date).key];store.set('sal_custom',S.custom);return render()}
  if(a==='prev'){S.date=addDays(S.date,-1);S.edit={};return render()}
  if(a==='next'){S.date=addDays(S.date,1);S.edit={};return render()}
  if(a==='notice'){S.noticeOpen=!S.noticeOpen;return render()}
  if(a==='refresh'){toast('새로 불러옵니다');return sync()}
  if(a==='settings')return settingsModal();
  if(a==='pref'){S.prefs[el.dataset.k]=el.dataset.v;store.set('sal_prefs',S.prefs);applyPrefs();return settingsModal()}
  if(a==='logout'){closeModal();logout();return loadGroups()}
  if(a==='period'){S.period=el.dataset.p;return render()}
  if(a==='more'){if(el.dataset.k==='W'){S.moreW=!S.moreW;S.moreM=false}else{S.moreM=!S.moreM;S.moreW=false}return render()}
  if(a==='clap'){doCheer(el.dataset.to,'👏').then(function(){toast('👏 박수를 보냈습니다')}).catch(function(){});return}
  if(a==='say'){var tx=draft('cheer');if(!tx)return toast('한마디를 적어 주세요');clearDraft('cheer');
    doCheer('',tx).then(function(){toast('응원을 보냈습니다')}).catch(function(){S.drafts.cheer=tx;render()});return}
  if(a==='install-hide'){S.prefs.installHide=true;store.set('sal_prefs',S.prefs);return render()}
  if(a==='install'){
    if(S.deferred){S.deferred.prompt();S.deferred.userChoice.then(function(){S.deferred=null;render()});return}
    return installGuide();
  }
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.deferred=e});
window.addEventListener('appinstalled',function(){S.prefs.installHide=true;store.set('sal_prefs',S.prefs);render()});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&S.me&&Date.now()-S.lastSync>60000){S.date=today();sync(true)}
});
function loadGroups(){
  return api('init').then(function(j){S.groups=j.groups||[];if(!S.me)render()}).catch(function(){if(!S.me)toast('연결이 안 됩니다. 잠시 후 다시 열어 주세요')});
}

/* ---------- 시작 ---------- */
cleanLocal();applyPrefs();index();render();
if(S.me)sync(!!S.data);else loadGroups();
if('serviceWorker' in navigator&&!DEMO){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
})();
</script>
